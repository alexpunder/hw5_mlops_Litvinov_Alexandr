project: postgres_repo
provider: local

registry:
    registry_type: sql
    path: postgresql+psycopg://tuser:12345@localhost:5432/mydb?sslmode=disable
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true

online_store:
    type: postgres
    host: localhost
    port: 5432
    database: mydb
    db_schema: public
    user: tuser
    password: "12345"
    sslmode: disable

offline_store:
    type: postgres
    host: localhost
    port: 5432
    database: mydb
    db_schema: public
    user: tuser
    password: "12345"
    sslmode: disable

entity_key_serialization_version: 3